services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      WEB_FRONTEND_ENABLED: ${WEB_FRONTEND_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?}
      APP_SECRET: ${APP_SECRET:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ADMIN_TOKEN_TTL_DAYS: ${ADMIN_TOKEN_TTL_DAYS:-3650}
      USER_USERNAME: ${USER_USERNAME:?}
      USER_PASSWORD: ${USER_PASSWORD:?}
      USER_TOKEN_TTL_DAYS: ${USER_TOKEN_TTL_DAYS:-3650}
      USER_AUTHORIZATION_PIN: ${USER_AUTHORIZATION_PIN:?}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?}
      TRANSACTION_NOTIFICATION_EMAILS: ${TRANSACTION_NOTIFICATION_EMAILS:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://pos2.asas.id,https://pos.local}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-pos2.asas.id,localhost,127.0.0.1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
      API_MAX_CONCURRENCY: ${API_MAX_CONCURRENCY:-50}
      API_THREAD_LIMIT: ${API_THREAD_LIMIT:-10}
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    cpus: "${API_CPU_LIMIT:-1.0}"
    mem_limit: "${API_MEMORY_LIMIT:-512m}"
    pids_limit: 256
    restart: "on-failure:5"
